name: Build Windows DLL



on:

  workflow_dispatch:
  


permissions:

  contents: read
  


jobs:

  build:
  
    runs-on: windows-2022
    


    steps:
    
      - name: Checkout
      
        uses: actions/checkout@v4
        


      - name: Configure MSBuild
      
        uses: microsoft/setup-msbuild@v2
        


      - name: Install project dependencies
      
        shell: pwsh
        
        run: |
        
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          
          & $vcpkg install jsoncpp:x64-windows curl:x64-windows spdlog:x64-windows
            
          if ($LASTEXITCODE -ne 0) {
          
            throw "vcpkg failed with exit code $LASTEXITCODE"
            
          }
          


      - name: Build Release x64 DLL
      
        shell: pwsh
        
        run: |
        
          msbuild .\csgo-sdk\csgo-sdk.vcxproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:VcpkgEnabled=true
            



















































