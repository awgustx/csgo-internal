name: Build HydraWare Win32 DLL

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install D3DX9 SDK
        shell: pwsh
        run: |
          $nuget = Join-Path $env:RUNNER_TEMP 'nuget.exe'
          Invoke-WebRequest -Uri 'https://dist.nuget.org/win-x86-commandline/latest/nuget.exe' -OutFile $nuget
          $out = Join-Path $env:RUNNER_TEMP 'd3dx'
          & $nuget install Microsoft.DXSDK.D3DX -Version 9.29.952.8 -OutputDirectory $out -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'D3DX9 installation failed' }
          $pkg = Get-ChildItem $out -Directory -Filter 'Microsoft.DXSDK.D3DX.*' | Select-Object -First 1
          if (-not $pkg) { throw 'D3DX9 package directory was not found' }
          $native = Join-Path $pkg.FullName 'build/native'
          $include = Join-Path $native 'include'
          $lib = Join-Path $native 'release/lib/x86'
          $bin = Join-Path $native 'release/bin/x86'
          "DXSDK_DIR=$native" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DXSDK_INCLUDE=$include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DXSDK_LIB=$lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DXSDK_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Release Win32 DLL
        shell: pwsh
        run: |
          $oldCl = if ($env:CL) { $env:CL } else { '' }
          $oldLink = if ($env:LINK) { $env:LINK } else { '' }
          $oldCl = $oldCl -replace '/std:c17', ''
          $env:CL = '/wd4828 /I"' + $env:DXSDK_INCLUDE + '" ' + $oldCl
          $env:LINK = '/LIBPATH:"' + $env:DXSDK_LIB + '" ' + $oldLink
          msbuild ./CSGOSimple/CSGOSimple.vcxproj /m /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:AdditionalDependencies=d3dx9.lib%3Bd3d9.lib%3Bd3dcompiler.lib
          if ($LASTEXITCODE -ne 0) { throw 'MSBuild failed' }
          Copy-Item (Join-Path $env:DXSDK_BIN 'D3DX9_43.dll') -Destination './CSGOSimple/bin/Release/D3DX9_43.dll' -Force

      - name: Verify PE32 output
        shell: pwsh
        run: |
          $dll = Get-ChildItem './CSGOSimple/bin/Release/*.dll' | Where-Object { $_.Name -notlike 'D3DX9_43.dll' } | Select-Object -First 1
          if (-not $dll) { throw 'HydraWare DLL was not produced' }
          Write-Host "Produced $($dll.FullName)"

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: hydraware-hotwheels-release-win32
          path: CSGOSimple/bin/Release/*.dll
          if-no-files-found: error
