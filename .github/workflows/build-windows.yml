name: Build Windows DLL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install D3DX9 SDK
        shell: pwsh
        run: |
          $nuget = Join-Path $env:RUNNER_TEMP 'nuget.exe'
          Invoke-WebRequest -Uri 'https://dist.nuget.org/win-x86-commandline/latest/nuget.exe' -OutFile $nuget
          $out = Join-Path $env:RUNNER_TEMP 'd3dx'
          & $nuget install Microsoft.DXSDK.D3DX -Version 9.29.952.8 -OutputDirectory $out -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'NuGet D3DX9 installation failed' }
          $pkg = Get-ChildItem $out -Directory -Filter 'Microsoft.DXSDK.D3DX.*' | Select-Object -First 1
          if (-not $pkg) { throw 'D3DX9 package directory was not found' }
          $native = Join-Path $pkg.FullName 'build/native'
          $include = Join-Path $native 'include'
          $lib = Join-Path $native 'release/lib/x86'
          $bin = Join-Path $native 'release/bin/x86'
          "DXSDK_INCLUDE=$include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DXSDK_LIB=$lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DXSDK_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install project dependencies
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          & $vcpkg install 'freetype[brotli,bzip2,png,zlib]:x86-windows-static-md' fmt:x86-windows-static-md libpng:x86-windows-static-md zlib:x86-windows-static-md bzip2:x86-windows-static-md brotli:x86-windows-static-md jsoncpp:x86-windows-static-md curl:x86-windows-static-md spdlog:x86-windows-static-md --recurse
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg dependency installation failed' }

      - name: Build Release Win32 DLL
        shell: pwsh
        run: |
          $oldCl = if ($env:CL) { $env:CL } else { '' }
          $oldLink = if ($env:LINK) { $env:LINK } else { '' }
          $vcpkgInclude = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x86-windows-static-md/include'
          $freetypeInclude = Join-Path $vcpkgInclude 'freetype2'
          $vcpkgLib = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x86-windows-static-md/lib'
          $vcpkgManualLib = Join-Path $vcpkgLib 'manual-link'
          $vcpkgRoot = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x86-windows-static-md'
          $oldCl = $oldCl -replace '/std:c17', ''
          $env:CL = '/wd4828 /I"' + $env:DXSDK_INCLUDE + '" /I"' + $vcpkgInclude + '" /I"' + $freetypeInclude + '" ' + $oldCl
          $libraryPatterns = @('freetype*.lib', 'fmt*.lib', 'libpng*.lib', 'zlib*.lib', 'zs*.lib', 'bz2*.lib', 'brotli*.lib')
          $resolvedLibraries = @()
          foreach ($pattern in $libraryPatterns) {
            Get-ChildItem -Path (Join-Path $vcpkgRoot 'lib') -Filter $pattern -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notmatch 'd\.lib$' } |
              ForEach-Object { $resolvedLibraries += '"' + $_.FullName + '"' }
          }
          Write-Host 'Resolved vcpkg static libraries:'
          $resolvedLibraries | ForEach-Object { Write-Host $_ }
          if (-not $resolvedLibraries) { throw 'No vcpkg static libraries were discovered' }
          $env:LINK = '/LIBPATH:"' + $env:DXSDK_LIB + '" /LIBPATH:"' + $vcpkgLib + '" /LIBPATH:"' + $vcpkgManualLib + '" ' + ($resolvedLibraries -join ' ') + ' ' + $oldLink
          msbuild ./csgo-sdk/csgo-sdk.vcxproj /m /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /p:VcpkgEnabled=true /p:VcpkgTriplet=x86-windows-static-md /p:LanguageStandard=stdcpp20 /p:AdditionalDependencies=d3dx9.lib%3Bd3d9.lib%3Bd3dcompiler.lib%3Bfreetype.lib%3Bfmt.lib
          if ($LASTEXITCODE -ne 0) { throw 'MSBuild failed' }
          Copy-Item (Join-Path $env:DXSDK_BIN 'D3DX9_43.dll') -Destination './csgo-sdk/release/D3DX9_43.dll' -Force

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: csgo-internal-release-win32
          path: csgo-sdk/release/*.dll
          if-no-files-found: error
